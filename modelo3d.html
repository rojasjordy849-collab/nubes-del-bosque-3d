<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nubes del Bosque — Maqueta 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce8df;color:#18352c;font-family:Inter,system-ui,Arial,sans-serif}
#scene{display:block;width:100vw;height:100vh;touch-action:none}
#panel{position:fixed;z-index:2;left:18px;top:18px;width:min(325px,calc(100vw - 36px));padding:17px 18px;border:1px solid #fff;border-radius:16px;background:rgba(249,251,245,.94);box-shadow:0 8px 30px #18352c25;backdrop-filter:blur(10px)}
h1{font-size:19px;letter-spacing:.025em;margin:0 0 4px}.subtitle{font-size:12px;color:#587065}p{font-size:12px;line-height:1.45;margin:8px 0 12px;color:#587065}.legend{font-size:12px;line-height:1.9}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
button{border:0;border-radius:9px;padding:9px 11px;background:#285844;color:#fff;font-weight:650;cursor:pointer;margin:8px 5px 0 0}button.alt{background:#e2ebe3;color:#285844}
#hint{position:fixed;z-index:2;right:18px;bottom:16px;background:#18352cdd;color:white;padding:9px 13px;border-radius:10px;font-size:11px}
@media(max-width:600px){#panel{left:9px;top:9px;width:270px;padding:13px}h1{font-size:16px}#hint{left:9px;right:9px;bottom:9px;text-align:center;font-size:10px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panel"><h1>NUBES DEL BOSQUE</h1><div class="subtitle">Eco-Lodge &amp; Senderos · Costa Rica</div>
<p>Maqueta conceptual tridimensional sobre una ladera tropical.</p>
<div class="legend"><div><span class="dot" style="background:#9a6842"></span>4 cabañas dobles · nivel alto</div><div><span class="dot" style="background:#bd8955"></span>2 cabañas familiares</div><div><span class="dot" style="background:#d6b77b"></span>Restaurante abierto</div><div><span class="dot" style="background:#7eaa8b"></span>Terraza panorámica de yoga</div></div>
<button id="home">Vista inicial</button><button class="alt" id="labels">Ocultar rótulos</button><button class="alt" id="rotate">Giro automático: no</button></div>
<div id="hint">Arrastra para girar · Rueda para acercar · Clic derecho para desplazar</div>
<script>
(function(){
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
if(!ctx){document.body.innerHTML='<div style="padding:30px;font:18px Arial">Este navegador no pudo crear un lienzo 2D. Prueba Google Chrome actualizado.</div>';return;}
let W=innerWidth,H=innerHeight,DPR=1,showLabels=true,autoRotate=false;
function resize(){DPR=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
const faces=[],labels=[];
const rnd=(()=>{let s=22931;return()=>((s=(s*1664525+1013904223)>>>0)/4294967296);})();
const col={
 grass:'#527d54',grass2:'#5d875c',wood:'#956443',wood2:'#b17d50',roof:'#303a35',
 stone:'#777d69',earth:'#977d57',window:'#e5b875',glass:'#8caeaa',
 leaf:['#285c3e','#39734a','#477d4e','#1f5039','#63905a'],trunk:'#60452e'
};
function hexRGB(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgbHex(a){return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function shade(base,p){
 const a=p[0],b=p[1],c=p[2],u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
 let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
 const l=Math.hypot(...n)||1;n=n.map(x=>x/l);const light=[-.42,.82,.38],dot=Math.abs(n[0]*light[0]+n[1]*light[1]+n[2]*light[2]);
 const k=.69+.30*dot;return rgbHex(hexRGB(base).map(x=>x*k));
}
function tri(a,b,c,color,stroke){faces.push({p:[a,b,c],color:shade(color,[a,b,c]),stroke:stroke||null});}
function quad(a,b,c,d,color,stroke){tri(a,b,c,color,stroke);tri(a,c,d,color,stroke);}
function box(x,y,z,w,h,d,color){
 const a=[x-w/2,y,z-d/2],b=[x+w/2,y,z-d/2],c=[x+w/2,y,z+d/2],e=[x-w/2,y,z+d/2];
 const A=[a[0],y+h,a[2]],B=[b[0],y+h,b[2]],C=[c[0],y+h,c[2]],E=[e[0],y+h,e[2]];
 quad(A,B,C,E,color);quad(a,e,E,A,color);quad(b,B,C,c,color);quad(e,c,C,E,color);quad(a,b,c,e,color);quad(a,b,B,A,color);
}
function terrainY(x,z){return 3.6+.105*(z+18)+2.1*Math.sin((x+9)*.105)+1.1*Math.cos(z*.13)+.7*Math.sin((x+z)*.16);}
function terrain(){
 const n=25,lo=-38,step=76/n,grid=[];
 for(let i=0;i<=n;i++){grid[i]=[];for(let j=0;j<=n;j++){const x=lo+i*step,z=lo+j*step;grid[i][j]=[x,terrainY(x,z),z];}}
 for(let i=0;i<n;i++)for(let j=0;j<n;j++){const a=grid[i][j],b=grid[i+1][j],c=grid[i+1][j+1],d=grid[i][j+1];const k=(rnd()-.5)*.10;tri(a,b,c,k>0?col.grass2:col.grass);tri(a,c,d,k<0?col.grass2:col.grass);}
 // exposed dark earth at the edge gives the hill a visible model base
 for(let i=0;i<n;i++){const a=grid[i][0],b=grid[i+1][0];quad(a,b,[b[0],-1.2,b[2]],[a[0],-1.2,a[2]],'#645a43');}
 for(let i=0;i<n;i++){const a=grid[n][i],b=grid[n][i+1];quad(a,b,[b[0],-1.2,b[2]],[a[0],-1.2,a[2]],'#645a43');}
 for(let i=n;i>0;i--){const a=grid[i][n],b=grid[i-1][n];quad(a,b,[b[0],-1.2,b[2]],[a[0],-1.2,a[2]],'#645a43');}
 for(let i=n;i>0;i--){const a=grid[0][i],b=grid[0][i-1];quad(a,b,[b[0],-1.2,b[2]],[a[0],-1.2,a[2]],'#645a43');}
}
function label(text,x,y,z){labels.push({text,p:[x,y,z]});}
function cabin(x,z,type,rot){
 const y=terrainY(x,z),w=type==='family'?6.2:5.1,d=type==='family'?5.4:4.6,h=2.45;
 // stone footing and timber deck
 box(x,y-.12,z,w+.5,.28,d+.5,col.stone);
 box(x,y+.16,z,w+1.1,.20,d*.8,col.wood2);
 // cabin body: warm wood wall planes
 box(x,y+.36,z,w,h,d,col.wood);
 // glowing front glazing and door
 const front=z+d/2+.012;
 quad([x-w*.34,y+.76,front],[x+w*.34,y+.76,front],[x+w*.34,y+2.05,front],[x-w*.34,y+2.05,front],col.window);
 quad([x-w*.055,y+.55,front+.018],[x+w*.06,y+.55,front+.018],[x+w*.06,y+2.25,front+.018],[x-w*.055,y+2.25,front+.018],col.wood2);
 // front/back gable triangles
 tri([x-w/2,y+h+.36,z-d/2],[x+w/2,y+h+.36,z-d/2],[x,y+h+1.55,z-d/2],col.wood2);
 tri([x-w/2,y+h+.36,z+d/2],[x+w/2,y+h+.36,z+d/2],[x,y+h+1.55,z+d/2],col.wood2);
 // pitched roof panels, ridge parallel to the long direction
 quad([x-w/2-.42,y+h+.35,z-d/2-.35],[x,y+h+1.58,z-d/2-.35],[x,y+h+1.58,z+d/2+.35],[x-w/2-.42,y+h+.35,z+d/2+.35],col.roof);
 quad([x,y+h+1.58,z-d/2-.35],[x+w/2+.42,y+h+.35,z-d/2-.35],[x+w/2+.42,y+h+.35,z+d/2+.35],[x,y+h+1.58,z+d/2+.35],col.roof);
 // raised deck rail and corner posts
 for(let s of [-1,1]){box(x+s*(w/2+.36),y+.35,z+d*.61,.12,.72,.12,col.wood2);box(x+s*(w/2+.36),y+.94,z+d*.61,.12,.1,.12,col.wood2);}
 label(type==='family'?'Cabaña familiar':'Cabaña doble',x,y+5.15,z);
}
function venue(x,z,w,d,h,name){
 const y=terrainY(x,z);box(x,y,z,w,h,d,col.wood2);
 quad([x-w*.36,y+.6,z+d/2+.02],[x+w*.36,y+.6,z+d/2+.02],[x+w*.36,y+h-.35,z+d/2+.02],[x-w*.36,y+h-.35,z+d/2+.02],col.window);
 tri([x-w/2,y+h,z-d/2],[x+w/2,y+h,z-d/2],[x,y+h+1.65,z-d/2],col.wood2);
 tri([x-w/2,y+h,z+d/2],[x+w/2,y+h,z+d/2],[x,y+h+1.65,z+d/2],col.wood2);
 quad([x-w/2-.5,y+h,z-d/2-.35],[x,y+h+1.72,z-d/2-.35],[x,y+h+1.72,z+d/2+.35],[x-w/2-.5,y+h,z+d/2+.35],col.roof);
 quad([x,y+h+1.72,z-d/2-.35],[x+w/2+.5,y+h,z-d/2-.35],[x+w/2+.5,y+h,z+d/2+.35],[x,y+h+1.72,z+d/2+.35],col.roof);
 label(name,x,y+h+2.8,z);
}
function ribbon(points,width,color){
 for(let i=0;i<points.length-1;i++){
  const a=points[i],b=points[i+1],dx=b[0]-a[0],dz=b[2]-a[2],len=Math.hypot(dx,dz)||1,ox=-dz/len*width/2,oz=dx/len*width/2;
  quad([a[0]+ox,a[1]+.09,a[2]+oz],[b[0]+ox,b[1]+.09,b[2]+oz],[b[0]-ox,b[1]+.09,b[2]-oz],[a[0]-ox,a[1]+.09,a[2]-oz],color);
 }
}
function tree(x,z,s){
 const y=terrainY(x,z),h=(4+rnd()*3.5)*s, sides=6,baseY=y,topY=y+h*.48,r=.22*s;
 for(let i=0;i<sides;i++){let a=i/sides*Math.PI*2,b=(i+1)/sides*Math.PI*2;quad([x+Math.cos(a)*r,baseY,z+Math.sin(a)*r],[x+Math.cos(b)*r,baseY,z+Math.sin(b)*r],[x+Math.cos(b)*r*.65,topY,z+Math.sin(b)*r*.65],[x+Math.cos(a)*r*.65,topY,z+Math.sin(a)*r*.65],col.trunk);}
 for(let level=0;level<3;level++){
  const cy=y+h*(.48+level*.18),radius=(1.35-level*.18)*s,tip=[x,cy+2.15*s,z],n=7;
  for(let i=0;i<n;i++){const a=i/n*Math.PI*2,b=(i+1)/n*Math.PI*2;
   tri([x+Math.cos(a)*radius,cy,z+Math.sin(a)*radius],[x+Math.cos(b)*radius,cy,z+Math.sin(b)*radius],tip,col.leaf[Math.floor(rnd()*col.leaf.length)]);
  }
 }
}
function shrub(x,z,s){const y=terrainY(x,z),n=5,tip=[x,y+s*1.5,z];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,b=(i+1)/n*Math.PI*2;tri([x+Math.cos(a)*s,y,z+Math.sin(a)*s],[x+Math.cos(b)*s,y,z+Math.sin(b)*s],tip,col.leaf[Math.floor(rnd()*col.leaf.length)]);}}
function build(){
 terrain();
 // six guest cabins laid out along the upper and middle contours
 cabin(-15,13,'double',-.16);cabin(-5,17,'double',.08);cabin(6,16,'double',-.1);cabin(16,11,'double',.18);
 cabin(-12,-1,'family',.15);cabin(12,-3,'family',-.18);
 venue(-1,-16,11,8,3.2,'Restaurante abierto');
 // restaurant terrace
 box(-1,terrainY(-1,-16)+.04,-16,14,.18,10,col.wood2);
 // panoramic yoga deck and posts
 const yy=terrainY(22,-17);box(22,yy+.05,-17,12,.22,8,'#7eaa8b');
 for(let i=0;i<4;i++){const x=17+i*3.2;box(x,yy+.25,-20,.15,1.15,.15,col.wood);}
 label('Terraza de yoga',22,yy+3,-17);
 // winding access trail
 const path=[];for(let i=0;i<=100;i++){const t=i/100,z=27-t*55,x=-22+44*t+5*Math.sin(t*4*Math.PI);path.push([x,terrainY(x,z),z]);}ribbon(path,1.45,col.earth);
 // parking and entrance
 const py=terrainY(-25,-24);box(-25,py+.05,-24,13,.2,8,col.stone);
 for(let i=0;i<3;i++)box(-29+i*4,py+.25,-24,2.3,.08,4,'#aaa58e');label('Acceso y parqueo',-25,py+3,-24);
 // dense tropical edge planting, leaving the paths and building clearings readable
 const clear=[[-15,13,5.4,5.4],[-5,17,5.4,5.4],[6,16,5.4,5.4],[16,11,5.4,5.4],[-12,-1,6.5,6],[12,-3,6.5,6],[-1,-16,9,7],[22,-17,8,6],[-25,-24,8,6]];
 for(let i=0;i<82;i++){const x=(rnd()-.5)*72,z=(rnd()-.5)*72;let skip=false;for(const c of clear)if(Math.abs(x-c[0])<c[2]&&Math.abs(z-c[1])<c[3])skip=true;if(!skip)tree(x,z,.7+rnd()*.72);}
 for(let i=0;i<105;i++){const x=(rnd()-.5)*70,z=(rnd()-.5)*70;let skip=false;for(const c of clear)if(Math.abs(x-c[0])<c[2]*.8&&Math.abs(z-c[1])<c[3]*.8)skip=true;if(!skip)shrub(x,z,.35+rnd()*.5);}
}
build();
let target=[0,8,0],yaw=.68,pitch=.72,distance=84,drag=null;
function cameraBasis(){
 const cp=Math.cos(pitch),sp=Math.sin(pitch),sy=Math.sin(yaw),cy=Math.cos(yaw);
 const cam=[target[0]+distance*sp*sy,target[1]+distance*cp,target[2]+distance*sp*cy];
 let f=[target[0]-cam[0],target[1]-cam[1],target[2]-cam[2]],fl=Math.hypot(...f);f=f.map(v=>v/fl);
 let r=[f[2],0,-f[0]],rl=Math.hypot(...r);r=r.map(v=>v/rl);
 let u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]];
 return {cam,f,r,u};
}
let projected=[];
function draw(){
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#c8dcd2');sky.addColorStop(.58,'#e4ece2');sky.addColorStop(1,'#d0ddcf');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 const basis=cameraBasis(),focal=Math.min(W,H)*1.05,ox=W*.5,oy=H*.54;
 function project(p){const q=[p[0]-basis.cam[0],p[1]-basis.cam[1],p[2]-basis.cam[2]],x=q[0]*basis.r[0]+q[1]*basis.r[1]+q[2]*basis.r[2],y=q[0]*basis.u[0]+q[1]*basis.u[1]+q[2]*basis.u[2],z=q[0]*basis.f[0]+q[1]*basis.f[1]+q[2]*basis.f[2];if(z<1)return null;return {x:ox+x*focal/z,y:oy-y*focal/z,z};}
 projected.length=0;
 for(const face of faces){const pts=face.p.map(project);if(pts.some(p=>!p))continue;const depth=(pts[0].z+pts[1].z+pts[2].z)/3;projected.push({pts,color:face.color,depth});}
 projected.sort((a,b)=>b.depth-a.depth);
 ctx.lineJoin='round';
 for(const item of projected){const p=item.pts;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);ctx.lineTo(p[1].x,p[1].y);ctx.lineTo(p[2].x,p[2].y);ctx.closePath();ctx.fillStyle=item.color;ctx.fill();}
 if(showLabels){
  const sorted=labels.map(l=>({l,p:project(l.p)})).filter(x=>x.p).sort((a,b)=>b.p.z-a.p.z);
  for(const item of sorted){const p=item.p,text=item.l.text;ctx.font='600 11px system-ui,Arial';const tw=ctx.measureText(text).width;const x=p.x-tw/2-7,y=p.y-10;if(x<-100||x>W+100||y<-40||y>H+30)continue;ctx.fillStyle='rgba(24,53,44,.84)';ctx.beginPath();ctx.roundRect(x,y,tw+14,20,6);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,p.x,p.y);}
 }
}
function frame(){if(autoRotate)yaw+=.0012;draw();requestAnimationFrame(frame);}frame();
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,button:e.button};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;if(drag.button===2||drag.button===1){const b=cameraBasis(),factor=distance*.0015;for(let i=0;i<3;i++)target[i]+=-dx*factor*b.r[i]+dy*factor*b.u[i];}else{yaw-=dx*.006;pitch=Math.max(.18,Math.min(1.35,pitch+dy*.006));}});
canvas.addEventListener('wheel',e=>{distance=Math.max(36,Math.min(135,distance*Math.exp(e.deltaY*.001)));},{passive:true});
document.getElementById('home').onclick=()=>{target=[0,8,0];yaw=.68;pitch=.72;distance=84;};
document.getElementById('labels').onclick=()=>{showLabels=!showLabels;document.getElementById('labels').textContent=showLabels?'Ocultar rótulos':'Mostrar rótulos';};
document.getElementById('rotate').onclick=()=>{autoRotate=!autoRotate;document.getElementById('rotate').textContent='Giro automático: '+(autoRotate?'sí':'no');};
})();
</script>
</body>
</html>
